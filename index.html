<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Fire.net.pk - Complete Billing Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @media print {
            body * { visibility: hidden; }
            .print-area, .print-area * { visibility: visible; }
            .print-area { position: absolute; top: 0; left: 0; width: 100%; margin: 0; padding: 0; background: white; }
            .page-break { page-break-before: always; }
            .no-print, .no-print * { display: none !important; }
        }
        @page { size: A4; margin: 14mm; }
        .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 50; }
        .modal-bg.active { display: flex; }
        .modal { background: white; border-radius: 20px; max-width: 850px; width: 90%; max-height: 90vh; overflow-y: auto; padding: 20px; }
        .filter-active { background-color: #dc2626 !important; color: white !important; border-color: #dc2626 !important; }
        .sync-success { background-color: #dcfce7; border: 1px solid #16a34a; }
        .sync-warning { background-color: #fef3c7; border: 1px solid #d97706; }
        .tab-active { background-color: #dc2626 !important; color: white !important; }
        .invoice-item-row { background: #fffbeb; border-left: 3px solid #f59e0b; margin-bottom: 5px; padding: 8px; border-radius: 8px; }
        .editable-paid-field { background: #fff3cd; border: 2px solid #ffc107; font-size: 18px; font-weight: bold; text-align: center; }
    </style>
</head>
<body class="bg-gray-100 font-sans">

<div class="container mx-auto px-4 py-6 max-w-7xl">
    <div class="flex flex-wrap justify-between items-center mb-6 border-b pb-4">
        <div>
            <h1 class="text-3xl font-bold text-red-700"><i class="fas fa-file-invoice-dollar mr-2"></i>Fire.net.pk Bill Printer</h1>
            <p class="text-gray-500">Invoices Tab | Edit Paid Amount Directly | Firebase Sync</p>
        </div>
        <div class="flex gap-2">
            <button id="downloadTemplateBtn" class="bg-gray-700 hover:bg-gray-800 text-white px-3 py-2 rounded-lg text-sm"><i class="fas fa-download"></i> CSV Template</button>
            <button id="exportBillsBtn" class="bg-green-700 hover:bg-green-800 text-white px-3 py-2 rounded-lg text-sm"><i class="fas fa-file-export"></i> Export CSV</button>
        </div>
    </div>

    <div id="dashboardCards" class="grid grid-cols-2 md:grid-cols-6 gap-3 mb-6"></div>
    <div id="syncAlert" class="mb-4 p-3 rounded-xl hidden"></div>

    <div class="flex flex-wrap gap-3 mb-6">
        <button id="syncFirebaseBtn" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-xl shadow"><i class="fas fa-database"></i> Sync from Firebase</button>
        <button id="autoGenerateBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl shadow"><i class="fas fa-magic"></i> Auto Generate</button>
        <button id="openAddBillBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl shadow"><i class="fas fa-plus-circle"></i> Manual Bill</button>
        <label class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-xl shadow cursor-pointer"><i class="fas fa-upload"></i> Import CSV <input type="file" id="csvUpload" accept=".csv" class="hidden"></label>
        <button id="bulkPrintBtn" class="bg-yellow-600 hover:bg-yellow-700 text-white px-4 py-2 rounded-xl shadow"><i class="fas fa-print"></i> Bulk Print</button>
        <button id="exportPdfBtn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl shadow"><i class="fas fa-file-pdf"></i> Export PDF</button>
        <button id="whatsappSelectedBtn" class="btn-wa hover:bg-green-700 text-white px-4 py-2 rounded-xl shadow"><i class="fab fa-whatsapp"></i> Send to Selected</button>
        <button id="selectAllBtn" class="border border-gray-400 bg-white px-4 py-2 rounded-xl shadow text-sm"><i class="fas fa-check-square"></i> Select All</button>
    </div>

    <!-- Tab Navigation -->
    <div class="flex gap-2 mb-4 border-b">
        <button id="tabBills" class="tab-btn px-5 py-2 rounded-t-lg font-bold bg-red-600 text-white">📋 Monthly Bills</button>
        <button id="tabInvoices" class="tab-btn px-5 py-2 rounded-t-lg font-bold bg-gray-200 text-gray-700">📄 Invoices (Monthly Breakdown)</button>
    </div>

    <!-- Bills Table -->
    <div id="billsPanel" class="bg-white rounded-2xl shadow overflow-hidden">
        <div class="overflow-x-auto">
            <table class="min-w-full">
                <thead><tr><th class="w-8 px-3 py-3"><input type="checkbox" id="selectAllHeader" class="rounded"></th>
                    <th class="px-3 py-3">Code</th><th>Customer</th><th>Mobile</th><th>Package</th><th>Area</th>
                    <th>Bill Month</th><th class="text-right">Bill</th><th class="text-right">Paid</th><th class="text-right">Due</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody id="billsTbody"></tbody>
            </table>
        </div>
        <div id="noBillsMsg" class="text-center py-8 text-gray-400 hidden">No bills found. Sync from Firebase.</div>
        <div id="paginationControls" class="flex justify-between items-center px-4 py-3 border-t bg-gray-50 no-print"></div>
    </div>

    <!-- Invoices Panel -->
    <div id="invoicesPanel" class="bg-white rounded-2xl shadow overflow-hidden hidden">
        <div class="p-4 border-b bg-gray-50">
            <h2 class="font-bold text-lg"><i class="fas fa-receipt text-amber-600"></i> All Invoices for Current Month</h2>
            <p class="text-sm text-gray-500">These invoices are automatically added to monthly bills with breakdown</p>
        </div>
        <div id="invoicesListContainer" class="p-4"></div>
    </div>
</div>

<!-- Edit Bill Modal -->
<div id="billModal" class="modal-bg"><div class="modal"><div class="flex justify-between border-b pb-2 mb-3"><h2 class="text-xl font-bold" id="modalTitle">Edit Bill</h2><button id="closeModalBtn" class="text-gray-500 text-2xl">&times;</button></div><div id="modalBody"></div></div></div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: 'AIzaSyDEOfh1JufNuoEIMEZ_tgt1Lg4PSLLUE7E',
        authDomain: 'complaint-b1f3c.firebaseapp.com',
        projectId: 'complaint-b1f3c',
        storageBucket: 'complaint-b1f3c.firebasestorage.app',
        messagingSenderId: '400630080362',
        appId: '1:400630080362:web:bbe16973f247dd67407b13'
    };
    
    let db = null;
    let isFirebaseConnected = false;
    let bills = [];
    let nextId = 1;
    const STORAGE_KEY = 'bill_print_tool_firebase';
    const PAGE_SIZE = 35;
    let currentFilter = 'all', currentPage = 1, filteredBills = [];
    let currentMonthFilter = new Date().toISOString().slice(0,7);
    let currentSearch = '';
    let clientsData = [];
    let financeData = [];
    let invoicesData = [];
    
    function getCurrentTimestamp() { return new Date().toLocaleString('en-PK', { timeZone: 'Asia/Karachi' }); }
    function getMonthDateRange(yearMonth) { let [y,m]=yearMonth.split('-').map(Number); let start=new Date(y,m-1,1), end=new Date(y,m,0); return { start: start.toLocaleDateString(), end: end.toLocaleDateString() }; }
    
    function generateReceiptId() {
        let d = new Date();
        return `FRN-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}-${Math.floor(Math.random()*9000)+1000}`;
    }
    
    function recalcBill(b) { 
        let totalPaid = (b.payments || []).reduce((s,p)=>s+(p.amount||0),0); 
        b.alreadyPaid = totalPaid; 
        let net = (b.monthlyBillAmount || 0) - (b.discount || 0) - totalPaid; 
        b.netDue = net > 0 ? net : 0; 
        if(!b.billNo) b.billNo = `MB-${(b.billMonth||'').replace('-','')}-${b.clientCode||'000'}`;
        if(!b.receiptId) b.receiptId = generateReceiptId();
        return b; 
    }
    
    function recalcAll() { bills.forEach(b=>recalcBill(b)); }
    function saveLocal() { localStorage.setItem(STORAGE_KEY, JSON.stringify({bills, nextId})); }
    function loadLocal() {
        let stored = localStorage.getItem(STORAGE_KEY);
        if(stored) { let data = JSON.parse(stored); bills = data.bills || []; nextId = data.nextId || 1; recalcAll(); }
        else { bills = []; nextId = 1; }
    }
    
    function getBillStatus(b) { 
        if(b.netDue === 0) return 'paid'; 
        if(b.alreadyPaid > 0) return 'partial'; 
        return 'unpaid'; 
    }
    function escapeHtml(s){ return String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }
    function numberFormat(n){ return (Number(n)||0).toLocaleString(); }
    function today(){ return new Date().toISOString().slice(0,10); }
    
    function initFirebase() {
        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            isFirebaseConnected = true;
            updateSyncAlert('success', 'Firebase connected.');
            return true;
        } catch(e) { updateSyncAlert('warning', 'Firebase connection failed.'); return false; }
    }
    
    function updateSyncAlert(type, message) {
        const alertDiv = document.getElementById('syncAlert');
        alertDiv.classList.remove('hidden', 'sync-success', 'sync-warning', 'sync-loading');
        if(type === 'success') alertDiv.classList.add('sync-success');
        else if(type === 'loading') alertDiv.classList.add('sync-loading');
        else alertDiv.classList.add('sync-warning');
        alertDiv.innerHTML = message;
    }
    
    async function syncFromFirebase() {
        if(!isFirebaseConnected && !initFirebase()) { alert("Firebase not connected."); return; }
        updateSyncAlert('loading', '<div class="spinner"></div> Fetching data...');
        try {
            const clientsSnapshot = await db.collection('clients').get();
            clientsData = clientsSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            const financeSnapshot = await db.collection('finance').get();
            financeData = financeSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            const invoicesSnapshot = await db.collection('invoices').get();
            invoicesData = invoicesSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            
            let month = currentMonthFilter;
            let existingCodes = bills.filter(b=>b.billMonth===month).map(b=>b.clientCode);
            let added = 0, updated = 0;
            
            for(let client of clientsData) {
                if(!client.name || !client.mobile) continue;
                let code = client.ccode || client.pin || client.id?.slice(-4) || '0000';
                let monthlyAmount = client.bill || client.monthlyFee || 1500;
                
                let clientInvoices = invoicesData.filter(inv => 
                    (inv.clientId === client.id || inv.phone === client.mobile || inv.cust === client.name) &&
                    inv.billMonth === month);
                
                let invoiceTotal = clientInvoices.reduce((sum, inv) => sum + (inv.total || 0), 0);
                let totalBillAmount = monthlyAmount + invoiceTotal;
                
                let payments = financeData.filter(f => 
                    (f.clientId === client.id || f.phone === client.mobile || f.customer === client.name) &&
                    f.type !== 'expense' && (f.billMonth === month || f.date?.slice(0,7) === month))
                    .map(f => ({ amount: f.amount || 0, method: f.mode || 'Cash', date: f.date || today(), timestamp: f.time || getCurrentTimestamp() }));
                
                if(existingCodes.includes(code)) {
                    let existingBill = bills.find(b => b.clientCode === code && b.billMonth === month);
                    if(existingBill) {
                        existingBill.monthlyBillAmount = totalBillAmount;
                        existingBill.baseMonthlyAmount = monthlyAmount;
                        existingBill.invoiceDetails = clientInvoices.map(inv => ({ id: inv.id, work: inv.work || 'Service', amount: inv.total || 0, date: inv.date || inv.time }));
                        existingBill.payments = payments;
                        recalcBill(existingBill);
                        updated++;
                    }
                } else {
                    let newBill = { 
                        id: nextId++, customerName: client.name, mobile: client.mobile, clientCode: code,
                        package: client.package || 'Standard', area: client.area || '', userId: client.pppoe || '',
                        billMonth: month, issueDate: today(), dueDate: client.dueDate || `${month}-10`,
                        monthlyBillAmount: totalBillAmount, baseMonthlyAmount: monthlyAmount,
                        discount: 0, payments: payments, 
                        invoiceDetails: clientInvoices.map(inv => ({ id: inv.id, work: inv.work || 'Service', amount: inv.total || 0, date: inv.date || inv.time })),
                        receiptId: generateReceiptId()
                    };
                    recalcBill(newBill);
                    bills.push(newBill);
                    added++;
                }
            }
            if(added > 0 || updated > 0) { saveLocal(); applyFiltersAndRender(); updateDashboard(); updateFilters(); renderInvoicesTab(); }
            updateSyncAlert('success', `✅ Sync complete! Added ${added}, updated ${updated}`);
            alert(`Sync Complete!\nClients: ${clientsData.length}\nNew bills: ${added}\nUpdated: ${updated}\nInvoices loaded: ${invoicesData.length}`);
        } catch(e) { updateSyncAlert('warning', `Sync failed: ${e.message}`); alert("Sync failed: " + e.message); }
    }
    
    function renderInvoicesTab() {
        let month = currentMonthFilter;
        let monthInvoices = invoicesData.filter(inv => inv.billMonth === month);
        let container = document.getElementById('invoicesListContainer');
        if (!container) return;
        
        if (monthInvoices.length === 0) {
            container.innerHTML = '<div class="text-center py-8 text-gray-400">No invoices found for this month. Sync from Firebase first.</div>';
            return;
        }
        
        let totalInvoiceAmount = monthInvoices.reduce((s, inv) => s + (inv.total || 0), 0);
        let groupedByClient = {};
        monthInvoices.forEach(inv => {
            let clientName = inv.cust || inv.clientName || 'Unknown';
            if (!groupedByClient[clientName]) groupedByClient[clientName] = [];
            groupedByClient[clientName].push(inv);
        });
        
        let html = `<div class="mb-4 p-3 bg-amber-50 rounded-lg"><b>📊 Summary for ${month}</b><br>Total Invoices: ${monthInvoices.length} | Total Amount: Rs. ${numberFormat(totalInvoiceAmount)}</div>`;
        html += `<div class="space-y-4">`;
        for (let [client, invs] of Object.entries(groupedByClient)) {
            let clientTotal = invs.reduce((s, inv) => s + (inv.total || 0), 0);
            html += `<div class="border rounded-lg overflow-hidden">
                <div class="bg-gray-100 p-3 font-bold">👤 ${escapeHtml(client)} <span class="float-right">Total: Rs. ${numberFormat(clientTotal)}</span></div>
                <table class="w-full text-sm">`;
            invs.forEach(inv => {
                html += `<tr class="border-b"><td class="p-2 pl-4">📄 ${escapeHtml(inv.work || 'Invoice')}</td>
                        <td class="p-2 text-right">Rs. ${numberFormat(inv.total || 0)}</td>
                        <td class="p-2 text-right text-gray-500">${inv.date || inv.time || ''}</td></tr>`;
            });
            html += `</table></div>`;
        }
        html += `</div>`;
        container.innerHTML = html;
    }
    
    function autoGenerateBills(){
        if(clientsData.length === 0) { alert("Sync from Firebase first."); return; }
        let month = currentMonthFilter;
        let existingCodes = bills.filter(b=>b.billMonth===month).map(b=>b.clientCode);
        let added = 0;
        for(let c of clientsData){
            if(!c.name || !c.mobile) continue;
            let code = c.ccode || c.pin || c.id?.slice(-4) || '0000';
            if(existingCodes.includes(code)) continue;
            let amount = c.bill || c.monthlyFee || 1500;
            let newBill = { 
                id: nextId++, customerName: c.name, mobile: c.mobile, clientCode: code,
                package: c.package || 'Standard', area: c.area || '', userId: c.pppoe || '',
                billMonth: month, issueDate: today(), dueDate: c.dueDate || `${month}-10`,
                monthlyBillAmount: amount, baseMonthlyAmount: amount, discount: 0, payments: [],
                invoiceDetails: [], receiptId: generateReceiptId()
            };
            recalcBill(newBill);
            bills.push(newBill);
            added++;
        }
        if(added) { saveLocal(); applyFiltersAndRender(); updateDashboard(); updateFilters(); alert(`Generated ${added} bills`); }
        else alert("All clients have bills for this month.");
    }
    
    function updateFilters(){
        let areas = [...new Set(bills.map(b=>b.area).filter(a=>a))];
        let packages = [...new Set(bills.map(b=>b.package).filter(p=>p))];
        document.getElementById('areaFilter').innerHTML = '<option value="">All Areas</option>' + areas.map(a=>`<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join('');
        document.getElementById('packageFilter').innerHTML = '<option value="">All Packages</option>' + packages.map(p=>`<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');
    }
    
    function applyFiltersAndRender(){
        let filtered = bills.filter(b => b.billMonth === currentMonthFilter);
        if(currentSearch.trim()){
            let s = currentSearch.toLowerCase();
            filtered = filtered.filter(b => b.customerName.toLowerCase().includes(s) || b.mobile.includes(s) || b.clientCode.toLowerCase().includes(s));
        }
        if(currentFilter === 'paid') filtered = filtered.filter(b=>getBillStatus(b)==='paid');
        else if(currentFilter === 'unpaid') filtered = filtered.filter(b=>getBillStatus(b)==='unpaid');
        else if(currentFilter === 'partial') filtered = filtered.filter(b=>getBillStatus(b)==='partial');
        let area = document.getElementById('areaFilter')?.value;
        if(area) filtered = filtered.filter(b=>b.area === area);
        let pkg = document.getElementById('packageFilter')?.value;
        if(pkg) filtered = filtered.filter(b=>b.package === pkg);
        filteredBills = filtered;
        currentPage = 1;
        renderTableBody();
        renderPagination();
        updateFilterStats();
        updateSelectAllHeader();
    }
    
    function renderTableBody(){
        let tbody = document.getElementById('billsTbody');
        let start = (currentPage-1)*PAGE_SIZE;
        let pageBills = filteredBills.slice(start, start+PAGE_SIZE);
        if(pageBills.length === 0 && filteredBills.length === 0){ 
            tbody.innerHTML = '<tr><td colspan="12" class="text-center py-8 text-gray-400">No bills found. Sync from Firebase.</td></tr>';
            return; 
        }
        tbody.innerHTML = pageBills.map(bill => {
            let status = getBillStatus(bill);
            let statusText = status === 'paid' ? 'Paid' : (status === 'partial' ? 'Partial' : 'Unpaid');
            let statusColor = status === 'paid' ? 'bg-green-100 text-green-800' : (status === 'partial' ? 'bg-yellow-100 text-yellow-800' : 'bg-red-100 text-red-800');
            let hasInvoices = bill.invoiceDetails && bill.invoiceDetails.length > 0;
            return `<tr>
                <td class="px-3 py-2"><input type="checkbox" class="bill-select" data-id="${bill.id}"></td>
                <td class="px-3 py-2">${escapeHtml(bill.clientCode)}${hasInvoices ? '<br><span class="text-xs text-amber-600">+inv</span>' : ''}</td>
                <td class="px-3 py-2 font-medium">${escapeHtml(bill.customerName)}</td>
                <td class="px-3 py-2">${escapeHtml(bill.mobile)}</td>
                <td class="px-3 py-2">${escapeHtml(bill.package)}</td>
                <td class="px-3 py-2">${escapeHtml(bill.area)}</td>
                <td class="px-3 py-2">${escapeHtml(bill.billMonth)}</td>
                <td class="px-3 py-2 text-right">Rs. ${numberFormat(bill.monthlyBillAmount)}</td>
                <td class="px-3 py-2 text-right">Rs. ${numberFormat(bill.alreadyPaid)}</td>
                <td class="px-3 py-2 text-right font-bold text-red-600">Rs. ${numberFormat(bill.netDue)}</td>
                <td class="px-3 py-2"><span class="px-2 py-1 rounded-full text-xs ${statusColor}">${statusText}</span></td>
                <td class="px-3 py-2 text-center">
                    <i class="fas fa-print text-blue-600 print-single mx-1 cursor-pointer" data-id="${bill.id}"></i>
                    <i class="fab fa-whatsapp text-green-600 whatsapp-single mx-1 cursor-pointer" data-id="${bill.id}"></i>
                    <i class="fas fa-edit text-amber-600 edit-bill mx-1 cursor-pointer" data-id="${bill.id}"></i>
                    <i class="fas fa-trash-alt text-red-500 delete-bill mx-1 cursor-pointer" data-id="${bill.id}"></i>
                </td>
            <tr>`;
        }).join('');
        attachTableEvents();
    }
    
    function renderPagination(){ 
        let totalPages = Math.ceil(filteredBills.length/PAGE_SIZE); 
        let c = document.getElementById('paginationControls'); 
        if(totalPages <= 1 && filteredBills.length === 0){ c.innerHTML = ''; return; } 
        let html = `<div class="text-sm">${((currentPage-1)*PAGE_SIZE)+1}-${Math.min(currentPage*PAGE_SIZE,filteredBills.length)} of ${filteredBills.length}</div><div class="flex gap-2">`; 
        if(currentPage > 1) html += `<button class="page-btn px-3 py-1 border rounded" data-page="${currentPage-1}">Prev</button>`; 
        for(let i = Math.max(1, currentPage-2); i <= Math.min(totalPages, currentPage+2); i++) html += `<button class="page-btn px-3 py-1 border rounded ${i === currentPage ? 'bg-red-600 text-white' : ''}" data-page="${i}">${i}</button>`;
        if(currentPage < totalPages) html += `<button class="page-btn px-3 py-1 border rounded" data-page="${currentPage+1}">Next</button>`; 
        html += `</div>`; 
        c.innerHTML = html; 
        document.querySelectorAll('.page-btn').forEach(btn => btn.addEventListener('click', () => { currentPage = parseInt(btn.dataset.page); renderTableBody(); renderPagination(); }));
    }
    
    function updateFilterStats(){ 
        let monthBills = bills.filter(b=>b.billMonth === currentMonthFilter);
        let total = monthBills.length, paid = monthBills.filter(b=>getBillStatus(b)==='paid').length;
        let unpaid = monthBills.filter(b=>getBillStatus(b)==='unpaid').length;
        let partial = monthBills.filter(b=>getBillStatus(b)==='partial').length;
        let totalDue = monthBills.reduce((s,b)=>s+b.netDue,0);
        document.getElementById('filterStats').innerHTML = `Month: ${currentMonthFilter} | Total:${total} | Paid:${paid} | Unpaid:${unpaid} | Partial:${partial} | Due:Rs.${numberFormat(totalDue)}`; 
    }
    
    function updateSelectAllHeader(){ 
        let all = document.querySelectorAll('.bill-select'), checked = document.querySelectorAll('.bill-select:checked');
        let h = document.getElementById('selectAllHeader'); if(h) h.checked = all.length > 0 && all.length === checked.length;
    }
    
    function attachTableEvents(){ 
        document.querySelectorAll('.print-single').forEach(el => el.addEventListener('click', () => printBillById(parseInt(el.dataset.id))));
        document.querySelectorAll('.whatsapp-single').forEach(el => el.addEventListener('click', () => sendSingleWhatsApp(parseInt(el.dataset.id))));
        document.querySelectorAll('.edit-bill').forEach(el => el.addEventListener('click', () => openEditBillModal(bills.find(b=>b.id===parseInt(el.dataset.id)))));
        document.querySelectorAll('.delete-bill').forEach(el => el.addEventListener('click', () => { if(confirm('Delete bill?')){ let id=parseInt(el.dataset.id); bills=bills.filter(b=>b.id!==id); saveLocal(); applyFiltersAndRender(); updateDashboard(); } }));
        document.querySelectorAll('.bill-select').forEach(cb => cb.addEventListener('change', updateSelectAllHeader));

                        <div>
                            <label class="text-sm">Payment Method for adjustment</label>
                            <select id="editMethod" class="border rounded p-2 w-full">
                                <option>Cash</option><option>Bank Transfer</option><option>JazzCash</option><option>Easypaisa</option>

                </div>
            </div>
        `;
        
        openModalWithContent(html, 'Edit Bill');
        
        function updateCalculations() {
            let baseAmount = parseFloat(document.getElementById('eBaseAmount')?.value) || 0;
            let discount = parseFloat(document.getElementById('editDiscount')?.value) || 0;
            let received = parseFloat(document.getElementById('editReceivedAmount')?.value) || 0;
            let invoiceTotal = (bill.invoiceDetails || []).reduce((s, i) => s + (i.amount || 0), 0);
            let totalBill = baseAmount + invoiceTotal;
            let netDue = totalBill - discount - received;
            if (netDue < 0) netDue = 0;
            
            document.getElementById('displayMonthlyBill').innerHTML = `Rs. ${numberFormat(totalBill)}`;
            document.getElementById('displayNetDue').innerHTML = `Rs. ${numberFormat(netDue)}`;
            document.getElementById('currentReceivedDisplay').innerHTML = `Rs. ${numberFormat(received)}`;
        }
        
        document.getElementById('eBaseAmount')?.addEventListener('input', updateCalculations);
        document.getElementById('editDiscount')?.addEventListener('input', updateCalculations);
        document.getElementById('editReceivedAmount')?.addEventListener('input', updateCalculations);
        
        document.getElementById('applyReceivedBtn')?.addEventListener('click', () => {
            let newReceived = parseFloat(document.getElementById('editReceivedAmount').value) || 0;
            let currentReceived = bill.alreadyPaid;
            let diff = newReceived - currentReceived;
            
            if (Math.abs(diff) < 0.01) {
                alert("Amount is already " + numberFormat(currentReceived));
                return;
            }
            
            let method = document.getElementById('editMethod').value;
            let timestamp = getCurrentTimestamp();
            
            if (diff > 0) {
                bill.payments.push({
                    amount: diff,
                    method: method,
                    date: today(),
                    timestamp: timestamp,
                    note: 'Manual adjustment'
                });
            } else {
                let amountToRemove = Math.abs(diff);
                while (amountToRemove > 0 && bill.payments.length > 0) {
                    let lastPayment = bill.payments[bill.payments.length - 1];
                    if (lastPayment.amount > amountToRemove) {
                        lastPayment.amount -= amountToRemove;
                        amountToRemove = 0;
                    } else {
                        amountToRemove -= lastPayment.amount;
                        bill.payments.pop();
                    }
                }
            }
            
            bill.alreadyPaid = newReceived;
            recalcBill(bill);
            updateCalculations();
            alert(`Received amount updated to Rs. ${numberFormat(newReceived)}`);
        });
        
        document.getElementById('saveEditBillBtn').onclick = () => {
            bill.customerName = document.getElementById('eName').value;
            bill.mobile = document.getElementById('eMobile').value;
            bill.clientCode = document.getElementById('eCode').value;
            bill.package = document.getElementById('ePkg').value;
            bill.area = document.getElementById('eArea').value;
            bill.userId = document.getElementById('eUser').value;
            bill.billMonth = document.getElementById('eMonth').value;
            bill.dueDate = document.getElementById('eDue').value;
            bill.baseMonthlyAmount = parseFloat(document.getElementById('eBaseAmount').value) || 0;
            let invoiceTotal = (bill.invoiceDetails || []).reduce((s, i) => s + (i.amount || 0), 0);
            bill.monthlyBillAmount = bill.baseMonthlyAmount + invoiceTotal;
            bill.discount = parseFloat(document.getElementById('editDiscount').value) || 0;
            bill.alreadyPaid = parseFloat(document.getElementById('editReceivedAmount').value) || 0;
            
            let netDue = bill.monthlyBillAmount - bill.discount - bill.alreadyPaid;
            bill.netDue = netDue > 0 ? netDue : 0;
            
            saveLocal();
            applyFiltersAndRender();
            updateDashboard();
            closeModal();
            alert(`Bill updated!\nTotal Bill: Rs. ${numberFormat(bill.monthlyBillAmount)}\nReceived: Rs. ${numberFormat(bill.alreadyPaid)}\nNet Due: Rs. ${numberFormat(bill.netDue)}`);
        };
        
        document.getElementById('closeEditModalBtn').onclick = closeModal;
        updateCalculations();
    }

    async function sendSingleWhatsApp(billId) {
        let bill = bills.find(b => b.id === billId);
        if(!bill) return;
        let phone = String(bill.mobile).replace(/\D/g, '');
        if(phone.startsWith('0') && phone.length === 11) phone = '92' + phone.slice(1);
        if(!phone) { alert("No valid mobile number."); return; }
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(generateWhatsAppMessage(bill))}`, '_blank');
    }
    
    async function sendSelectedWhatsApp() {
        let ids = [...document.querySelectorAll('.bill-select:checked')].map(cb=>parseInt(cb.dataset.id));
        if(ids.length === 0) { alert("Select bills first."); return; }
        let selected = bills.filter(b => ids.includes(b.id) && getBillStatus(b) !== 'paid');
        if(selected.length === 0) { alert("Selected bills are paid."); return; }
        if(!confirm(`Send to ${selected.length} client(s)?`)) return;
        for(let i=0; i<selected.length; i++) setTimeout(() => { 
            let p = String(selected[i].mobile).replace(/\D/g, '');
            if(p.startsWith('0') && p.length === 11) p = '92' + p.slice(1);
            if(p) window.open(`https://wa.me/${p}?text=${encodeURIComponent(generateWhatsAppMessage(selected[i]))}`, '_blank'); 
        }, i*800);
    }

    // CSV Import
    document.getElementById('csvUpload').addEventListener('change', function(e){ 
        let file = e.target.files[0]; if(!file) return; 
        Papa.parse(file, {header: true, complete: function(r){ 
            let added = 0; 
            for(let row of r.data){ 
                if(!row['Customer Name']) continue; 
                let payments = []; let paid = parseFloat(row['Already Paid']||0); 
                if(paid > 0) payments.push({amount: paid, method: "CSV Import", date: today(), timestamp: getCurrentTimestamp()}); 
                let nb = { id: nextId++, customerName: row['Customer Name'], mobile: row['Mobile'], clientCode: row['Client Code'],
                    package: row['Package'], area: row['Area'], userId: row['User ID / PPPoE'],
                    billMonth: row['Bill Month'] || currentMonthFilter, issueDate: row['Issue Date'] || today(),
                    dueDate: row['Due Date'] || `${currentMonthFilter}-10`, monthlyBillAmount: parseFloat(row['Monthly Bill Amount']) || 0,
                    baseMonthlyAmount: parseFloat(row['Monthly Bill Amount']) || 0, discount: parseFloat(row['Discount']) || 0, 
                    payments: payments, invoiceDetails: [], receiptId: generateReceiptId() }; 
                recalcBill(nb); bills.push(nb); added++; 
            } 
            if(added){ saveLocal(); applyFiltersAndRender(); updateDashboard(); updateFilters(); alert(`Imported ${added} bills`); } 
        }}); e.target.value = ''; 
    });
    
    document.getElementById('downloadTemplateBtn').addEventListener('click', () => { 
        let headers = ["Customer Name","Mobile","Client Code","Package","Area","User ID / PPPoE","Bill Month","Issue Date","Due Date","Monthly Bill Amount","Discount","Already Paid"]; 
        let sample = ["Sheraz","03021433803","0518","4mb","HEAD QUARTER","HQSabir","2026-06","2026-06-04","2026-06-10","2200","200","1000"]; 
        let csv = headers.join(",")+"\n"+sample.join(","); 
        let blob = new Blob([csv], {type: "text/csv"}); let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "bill_template.csv"; a.click(); 
    });
    
    document.getElementById('exportBillsBtn').addEventListener('click', () => { 
        let exportData = bills.map(b => ({ "Customer Name": b.customerName, "Mobile": b.mobile, "Client Code": b.clientCode,
            "Package": b.package, "Area": b.area, "User ID": b.userId, "Bill Month": b.billMonth, "Due Date": b.dueDate,
            "Monthly Bill": b.monthlyBillAmount, "Discount": b.discount, "Total Paid": b.alreadyPaid, "Net Due": b.netDue,
            "Status": getBillStatus(b) === 'paid' ? 'Paid' : (getBillStatus(b) === 'partial' ? 'Partial' : 'Unpaid') })); 
        let csv = Papa.unparse(exportData); let blob = new Blob([csv], {type: "text/csv"}); 
        let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `bills_export_${currentMonthFilter}.csv`; a.click(); 
    });
    
    loadLocal();
    applyFiltersAndRender();
    updateDashboard();
    updateFilters();
    initFirebase();
    renderInvoicesTab();
</script>
</body>
</html>
