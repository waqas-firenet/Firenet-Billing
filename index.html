<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Fire.net.pk - Complete Billing Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <style>
        @media print {
            body * { visibility: hidden; }
            .print-area, .print-area * { visibility: visible; }
            .print-area { position: absolute; top: 0; left: 0; width: 100%; margin: 0; padding: 0; background: white; }
            .page-break { page-break-before: always; }
            .no-print, .no-print * { display: none !important; }
        }
        @page { size: A4; margin: 14mm; }
        .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 50; }
        .modal-bg.active { display: flex; }
        .modal { background: white; border-radius: 20px; max-width: 850px; width: 90%; max-height: 90vh; overflow-y: auto; padding: 20px; }
        .filter-active { background-color: #dc2626 !important; color: white !important; border-color: #dc2626 !important; }
        .sync-success { background-color: #dcfce7; border: 1px solid #16a34a; }
        .sync-warning { background-color: #fef3c7; border: 1px solid #d97706; }
        .sync-loading { background-color: #dbeafe; border: 1px solid #2563eb; }
        .spinner { border: 2px solid #f3f3f3; border-top: 2px solid #3498db; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; display: inline-block; margin-right: 8px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn-wa { background-color: #25D366; color: white; }
        .btn-wa:hover { background-color: #128C7E; }
        .editable-paid-field { background: #fff3cd; border: 2px solid #ffc107; font-size: 18px; font-weight: bold; text-align: center; }
        .invoice-breakdown { background: #fffbeb; border-left: 3px solid #f59e0b; margin: 5px 0; padding: 8px; border-radius: 6px; }
    </style>
</head>
<body class="bg-gray-100 font-sans">

<div class="container mx-auto px-4 py-6 max-w-7xl">
    <div class="flex flex-wrap justify-between items-center mb-6 border-b pb-4">
        <div>
            <h1 class="text-3xl font-bold text-red-700"><i class="fas fa-file-invoice-dollar mr-2"></i>Fire.net.pk Bill Printer</h1>
            <p class="text-gray-500">Auto-merges Invoices with Monthly Bills | Direct Edit Received Amount</p>
        </div>
        <div class="flex gap-2">
            <button id="downloadTemplateBtn" class="bg-gray-700 hover:bg-gray-800 text-white px-3 py-2 rounded-lg text-sm"><i class="fas fa-download"></i> CSV Template</button>
            <button id="exportBillsBtn" class="bg-green-700 hover:bg-green-800 text-white px-3 py-2 rounded-lg text-sm"><i class="fas fa-file-export"></i> Export CSV</button>
        </div>
    </div>

    <div id="dashboardCards" class="grid grid-cols-2 md:grid-cols-6 gap-3 mb-6"></div>
    <div id="syncAlert" class="mb-4 p-3 rounded-xl hidden"></div>

    <div class="flex flex-wrap gap-3 mb-6">
        <button id="syncFirebaseBtn" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-xl shadow"><i class="fas fa-database"></i> Sync from Firebase</button>
        <button id="autoGenerateBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl shadow"><i class="fas fa-magic"></i> Generate Monthly Bills</button>
        <button id="openAddBillBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl shadow"><i class="fas fa-plus-circle"></i> Manual Bill</button>
        <label class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-xl shadow cursor-pointer"><i class="fas fa-upload"></i> Import CSV <input type="file" id="csvUpload" accept=".csv" class="hidden"></label>
        <button id="bulkPrintBtn" class="bg-yellow-600 hover:bg-yellow-700 text-white px-4 py-2 rounded-xl shadow"><i class="fas fa-print"></i> Bulk Print</button>
        <button id="exportPdfBtn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl shadow"><i class="fas fa-file-pdf"></i> Export PDF</button>
        <button id="whatsappSelectedBtn" class="btn-wa hover:bg-green-700 text-white px-4 py-2 rounded-xl shadow"><i class="fab fa-whatsapp"></i> Send Reminder</button>
        <button id="selectAllBtn" class="border border-gray-400 bg-white px-4 py-2 rounded-xl shadow text-sm"><i class="fas fa-check-square"></i> Select All</button>
    </div>

    <!-- Filter Bar -->
    <div class="flex flex-wrap gap-3 mb-4 items-center bg-white p-3 rounded-xl shadow">
        <div><span class="font-bold">Search:</span></div>
        <input type="text" id="searchInput" placeholder="Name, Mobile, Code..." class="border rounded-lg px-3 py-1.5 w-64 text-sm">
        <div class="h-6 w-px bg-gray-300 mx-1"></div>
        <div><span class="font-bold">Status:</span></div>
        <button data-filter="all" class="filter-btn px-3 py-1 rounded-lg border bg-white text-sm">All</button>
        <button data-filter="paid" class="filter-btn px-3 py-1 rounded-lg border bg-white text-sm">Paid</button>
        <button data-filter="unpaid" class="filter-btn px-3 py-1 rounded-lg border bg-white text-sm">Unpaid</button>
        <button data-filter="partial" class="filter-btn px-3 py-1 rounded-lg border bg-white text-sm">Partial</button>
        <div class="h-6 w-px bg-gray-300 mx-1"></div>
        <div><span class="font-bold">Area:</span></div>
        <select id="areaFilter" class="border rounded-lg px-2 py-1 text-sm bg-white"><option value="">All Areas</option></select>
        <div><span class="font-bold">Package:</span></div>
        <select id="packageFilter" class="border rounded-lg px-2 py-1 text-sm bg-white"><option value="">All Packages</option></select>
        <div><span class="font-bold">Month:</span></div>
        <input type="month" id="monthFilter" class="border rounded-lg px-2 py-1 text-sm">
        <div class="flex-1 text-right text-sm text-gray-500" id="filterStats"></div>
    </div>

    <!-- Bills Table -->
    <div class="bg-white rounded-2xl shadow overflow-hidden">
        <div class="overflow-x-auto">
            <table class="min-w-full">
                <thead class="bg-gray-50 border-b">
                    <tr>
                        <th class="w-8 px-3 py-3"><input type="checkbox" id="selectAllHeader" class="rounded"></th>
                        <th class="px-3 py-3 text-left text-xs font-medium">Code</th>
                        <th class="px-3 py-3 text-left text-xs font-medium">Customer</th>
                        <th class="px-3 py-3 text-left text-xs font-medium">Mobile</th>
                        <th class="px-3 py-3 text-left text-xs font-medium">Package</th>
                        <th class="px-3 py-3 text-left text-xs font-medium">Area</th>
                        <th class="px-3 py-3 text-left text-xs font-medium">Month</th>
                        <th class="px-3 py-3 text-right text-xs font-medium">Bill (Rs)</th>
                        <th class="px-3 py-3 text-right text-xs font-medium">Paid (Rs)</th>
                        <th class="px-3 py-3 text-right text-xs font-medium">Due (Rs)</th>
                        <th class="px-3 py-3 text-left text-xs font-medium">Status</th>
                        <th class="px-3 py-3 text-center text-xs font-medium">Actions</th>
                    </tr>
                </thead>
                <tbody id="billsTbody"></tbody>
            </table>
        </div>
        <div id="noBillsMsg" class="text-center py-8 text-gray-400 hidden">No bills found. Click "Sync from Firebase" to load data.</div>
        <div id="paginationControls" class="flex justify-between items-center px-4 py-3 border-t bg-gray-50 no-print"></div>
    </div>
</div>

<!-- Edit Bill Modal -->
<div id="billModal" class="modal-bg"><div class="modal"><div class="flex justify-between border-b pb-2 mb-3"><h2 class="text-xl font-bold" id="modalTitle">Edit Bill</h2><button id="closeModalBtn" class="text-gray-500 text-2xl">&times;</button></div><div id="modalBody"></div></div></div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: 'AIzaSyDEOfh1JufNuoEIMEZ_tgt1Lg4PSLLUE7E',
        authDomain: 'complaint-b1f3c.firebaseapp.com',
        projectId: 'complaint-b1f3c',
        storageBucket: 'complaint-b1f3c.firebasestorage.app',
        messagingSenderId: '400630080362',
        appId: '1:400630080362:web:bbe16973f247dd67407b13'
    };
    
    let db = null;
    let isFirebaseConnected = false;
    let bills = [];
    let nextId = 1;
    const STORAGE_KEY = 'bill_print_tool_v2';
    const PAGE_SIZE = 35;
    let currentFilter = 'all', currentPage = 1, filteredBills = [];
    let currentMonthFilter = new Date().toISOString().slice(0,7);
    let currentSearch = '';
    let clientsData = [];
    let financeData = [];
    let invoicesData = [];
    
    // Helper functions
    function getCurrentTimestamp() { return new Date().toLocaleString('en-PK', { timeZone: 'Asia/Karachi' }); }
    function getMonthDateRange(yearMonth) { 
        let [y,m]=yearMonth.split('-').map(Number); 
        let start=new Date(y,m-1,1); 
        let end=new Date(y,m,0); 
        return { start: start.toLocaleDateString('en-PK', {day:'numeric', month:'long', year:'numeric'}), 
                 end: end.toLocaleDateString('en-PK', {day:'numeric', month:'long', year:'numeric'}) }; 
    }
    
    function generateReceiptId() {
        let d = new Date();
        return `FRN-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}-${Math.floor(Math.random()*9000)+1000}`;
    }
    
    function recalcBill(b) { 
        let totalPaid = (b.payments || []).reduce((s,p)=>s+(p.amount||0),0); 
        b.alreadyPaid = totalPaid; 
        let net = (b.monthlyBillAmount || 0) - (b.discount || 0) - totalPaid; 
        b.netDue = net > 0 ? net : 0; 
        if(!b.billNo) b.billNo = `MB-${(b.billMonth||'').replace('-','')}-${b.clientCode||'000'}`;
        if(!b.receiptId) b.receiptId = generateReceiptId();
        return b; 
    }
    
    function recalcAll() { bills.forEach(b=>recalcBill(b)); }
    function saveLocal() { localStorage.setItem(STORAGE_KEY, JSON.stringify({bills, nextId})); }
    
    function loadLocal() {
        try {
            let stored = localStorage.getItem(STORAGE_KEY);
            if(stored) { 
                let data = JSON.parse(stored); 
                bills = data.bills || []; 
                nextId = data.nextId || Math.max(0, ...bills.map(b=>b.id), 0) + 1;
                recalcAll();
            } else { 
                bills = []; 
                nextId = 1; 
            }
        } catch(e) { console.error("Load error:", e); bills = []; nextId = 1; }
    }
    
    function getBillStatus(b) { 
        if(b.netDue === 0) return 'paid'; 
        if(b.alreadyPaid > 0) return 'partial'; 
        return 'unpaid'; 
    }
    function escapeHtml(s){ return String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }
    function numberFormat(n){ return (Number(n)||0).toLocaleString(); }
    function today(){ return new Date().toISOString().slice(0,10); }
    
    function initFirebase() {
        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            isFirebaseConnected = true;
            const alertDiv = document.getElementById('syncAlert');
            if(alertDiv) alertDiv.innerHTML = '<i class="fas fa-check-circle text-green-600 mr-2"></i> Firebase connected. Ready to sync.';
            if(alertDiv) alertDiv.className = 'mb-4 p-3 rounded-xl sync-success';
            return true;
        } catch(e) { 
            console.error("Firebase init error:", e);
            const alertDiv = document.getElementById('syncAlert');
            if(alertDiv) alertDiv.innerHTML = '<i class="fas fa-exclamation-triangle text-amber-600 mr-2"></i> Firebase connection failed. Using local data.';
            if(alertDiv) alertDiv.className = 'mb-4 p-3 rounded-xl sync-warning';
            return false; 
        }
    }
    
    // Main Sync Function - Fetches all data and merges invoices with monthly bills
    async function syncFromFirebase() {
        const alertDiv = document.getElementById('syncAlert');
        if(!alertDiv) return;
        
        alertDiv.innerHTML = '<div class="spinner"></div> Connecting to Firebase...';
        alertDiv.className = 'mb-4 p-3 rounded-xl sync-loading';
        
        if(!isFirebaseConnected && !initFirebase()) { 
            alertDiv.innerHTML = '<i class="fas fa-exclamation-triangle text-amber-600 mr-2"></i> Firebase connection failed.';
            alertDiv.className = 'mb-4 p-3 rounded-xl sync-warning';
            return; 
        }
        
        alertDiv.innerHTML = '<div class="spinner"></div> Fetching clients...';
        
        try {
            // Fetch all data from Firebase
            const clientsSnapshot = await db.collection('clients').get();
            clientsData = clientsSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            
            alertDiv.innerHTML = '<div class="spinner"></div> Fetching finance records...';
            const financeSnapshot = await db.collection('finance').get();
            financeData = financeSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            
            alertDiv.innerHTML = '<div class="spinner"></div> Fetching invoices...';
            const invoicesSnapshot = await db.collection('invoices').get();
            invoicesData = invoicesSnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            
            alertDiv.innerHTML = '<div class="spinner"></div> Merging data with monthly bills...';
            
            let month = currentMonthFilter;
            let existingBillsMap = new Map();
            bills.forEach(b => { if(b.billMonth === month) existingBillsMap.set(b.clientCode, b); });
            
            let added = 0, updated = 0;
            let newBills = [];
            
            for(let client of clientsData) {
                if(!client.name || !client.mobile) continue;
                
                let code = client.ccode || client.pin || client.id?.slice(-4) || '0000';
                let monthlyAmount = client.bill || client.monthlyFee || client.monthly_bill || 1500;
                
                // Find ALL invoices for this client in the current month
                let clientInvoices = invoicesData.filter(inv => {
                    let matches = false;
                    if(inv.clientId && inv.clientId === client.id) matches = true;
                    if(inv.phone && inv.phone === client.mobile) matches = true;
                    if(inv.cust && inv.cust === client.name) matches = true;
                    if(inv.clientName && inv.clientName === client.name) matches = true;
                    return matches && (inv.billMonth === month);
                });
                
                // Calculate total from invoices
                let invoiceTotal = clientInvoices.reduce((sum, inv) => sum + (Number(inv.total) || 0), 0);
                let totalBillAmount = monthlyAmount + invoiceTotal;
                
                // Find payments for this client
                let payments = financeData.filter(f => {
                    let matches = false;
                    if(f.clientId && f.clientId === client.id) matches = true;
                    if(f.phone && f.phone === client.mobile) matches = true;
                    if(f.customer && f.customer === client.name) matches = true;
                    if(f.paidBy && f.paidBy === client.name) matches = true;
                    return matches && f.type !== 'expense' && (f.billMonth === month || f.date?.slice(0,7) === month);
                }).map(f => ({ 
                    amount: Number(f.amount) || 0, 
                    method: f.mode || f.payment_mode || 'Cash', 
                    date: f.date || f.time || today(), 
                    timestamp: f.time || getCurrentTimestamp(),
                    note: f.note || f.receiptId || ''
                }));
                
                // Prepare invoice details for breakdown display
                let invoiceDetails = clientInvoices.map(inv => ({
                    id: inv.id,
                    work: inv.work || inv.invoice_type || 'Service Invoice',
                    amount: Number(inv.total) || 0,
                    date: inv.date || inv.time || today(),
                    description: inv.note || inv.description || ''
                }));
                
                let existingBill = existingBillsMap.get(code);
                if(existingBill) {
                    // Update existing bill
                    existingBill.monthlyBillAmount = totalBillAmount;
                    existingBill.baseMonthlyAmount = monthlyAmount;
                    existingBill.invoiceDetails = invoiceDetails;
                    existingBill.invoiceTotal = invoiceTotal;
                    existingBill.payments = payments;
                    recalcBill(existingBill);
                    updated++;
                } else {
                    // Create new bill
                    let newBill = { 
                        id: nextId++, 
                        customerName: client.name, 
                        mobile: client.mobile, 
                        clientCode: code, 
                        package: client.package || 'Standard', 
                        area: client.area || client.address || '', 
                        userId: client.pppoe || client.username || '', 
                        billMonth: month, 
                        issueDate: today(), 
                        dueDate: client.dueDate || client.exDate || `${month}-10`, 
                        monthlyBillAmount: totalBillAmount,
                        baseMonthlyAmount: monthlyAmount,
                        invoiceTotal: invoiceTotal,
                        discount: 0, 
                        payments: payments, 
                        invoiceDetails: invoiceDetails,
                        receiptId: generateReceiptId()
                    };
                    recalcBill(newBill);
                    newBills.push(newBill);
                    added++;
                }
            }
            
            // Add new bills
            bills.push(...newBills);
            
            if(added > 0 || updated > 0) { 
                saveLocal(); 
                applyFiltersAndRender(); 
                updateDashboard(); 
                updateFilters(); 
            }
            
            alertDiv.innerHTML = `<i class="fas fa-check-circle text-green-600 mr-2"></i> ✅ Sync complete! Added ${added} new bills, updated ${updated} bills. Invoices loaded: ${invoicesData.length}`;
            alertDiv.className = 'mb-4 p-3 rounded-xl sync-success';
            
            // Show invoice summary
            let totalInvoiceAmount = invoicesData.filter(inv => inv.billMonth === month).reduce((s,inv) => s + (Number(inv.total)||0), 0);
            alert(`Sync Complete!\n\n📊 Summary for ${month}:\n• Clients: ${clientsData.length}\n• Finance Records: ${financeData.length}\n• Invoices Found: ${invoicesData.length}\n• Invoice Total: Rs. ${numberFormat(totalInvoiceAmount)}\n• New Bills: ${added}\n• Updated Bills: ${updated}`);
            
        } catch(e) { 
            console.error("Firebase sync error:", e);
            alertDiv.innerHTML = `<i class="fas fa-exclamation-triangle text-amber-600 mr-2"></i> Sync failed: ${e.message}`;
            alertDiv.className = 'mb-4 p-3 rounded-xl sync-warning';
            alert("Sync failed: " + e.message + "\n\nMake sure you have internet connection and Firebase is accessible.");
        }
    }
    
    // Generate monthly bills from client data (without invoices)
    function autoGenerateBills(){
        if(clientsData.length === 0) { 
            alert("No client data available. Please click 'Sync from Firebase' first."); 
            return; 
        }
        
        let month = currentMonthFilter;
        let existingCodes = new Set(bills.filter(b=>b.billMonth===month).map(b=>b.clientCode));
        let added = 0;
        let totalAmount = 0;
        
        for(let c of clientsData){
            if(!c.name || !c.mobile) continue;
            let code = c.ccode || c.pin || c.id?.slice(-4) || '0000';
            if(existingCodes.has(code)) continue;
            
            let amount = c.bill || c.monthlyFee || c.monthly_bill || 1500;
            
            let newBill = { 
                id: nextId++, 
                customerName: c.name, 
                mobile: c.mobile, 
                clientCode: code, 
                package: c.package || 'Standard', 
                area: c.area || c.address || '', 
                userId: c.pppoe || c.username || '', 
                billMonth: month, 
                issueDate: today(), 
                dueDate: c.dueDate || c.exDate || `${month}-10`, 
                monthlyBillAmount: amount,
                baseMonthlyAmount: amount,
                invoiceTotal: 0,
                discount: 0, 
                payments: [], 
                invoiceDetails: [],
                receiptId: generateReceiptId()
            };
            recalcBill(newBill);
            bills.push(newBill);
            added++;
            totalAmount += amount;
        }
        
        if(added) { 
            saveLocal(); 
            applyFiltersAndRender(); 
            updateDashboard(); 
            updateFilters(); 
            alert(`Generated ${added} monthly bills for ${month}\nTotal Bill Amount: Rs. ${numberFormat(totalAmount)}`);
        } else {
            alert("All clients already have bills for this month. Change the month filter to generate for a different month.");
        }
    }
    
    function updateFilters(){
        let areas = [...new Set(bills.map(b=>b.area).filter(a=>a))];
        let packages = [...new Set(bills.map(b=>b.package).filter(p=>p))];
        let areaSel = document.getElementById('areaFilter');
        let pkgSel = document.getElementById('packageFilter');
        if(areaSel) areaSel.innerHTML = '<option value="">All Areas</option>' + areas.map(a=>`<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join('');
        if(pkgSel) pkgSel.innerHTML = '<option value="">All Packages</option>' + packages.map(p=>`<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');
    }
    
    function applyFiltersAndRender(){
        let filtered = bills.filter(b => b.billMonth === currentMonthFilter);
        
        if(currentSearch.trim()){
            let s = currentSearch.toLowerCase();
            filtered = filtered.filter(b => 
                b.customerName.toLowerCase().includes(s) || 
                b.mobile.includes(s) || 
                b.clientCode.toLowerCase().includes(s) ||
                (b.userId && b.userId.toLowerCase().includes(s))
            );
        }
        
        if(currentFilter === 'paid') filtered = filtered.filter(b=>getBillStatus(b)==='paid');
        else if(currentFilter === 'unpaid') filtered = filtered.filter(b=>getBillStatus(b)==='unpaid');
        else if(currentFilter === 'partial') filtered = filtered.filter(b=>getBillStatus(b)==='partial');
        
        let areaVal = document.getElementById('areaFilter')?.value;
        if(areaVal) filtered = filtered.filter(b=>b.area === areaVal);
        
        let pkgVal = document.getElementById('packageFilter')?.value;
        if(pkgVal) filtered = filtered.filter(b=>b.package === pkgVal);
        
        filteredBills = filtered;
        currentPage = 1;
        renderTableBody();
        renderPagination();
        updateFilterStats();
        updateSelectAllHeader();
    }
    
    function renderTableBody(){
        let tbody = document.getElementById('billsTbody');
        if(!tbody) return;
        
        let start = (currentPage-1)*PAGE_SIZE;
        let pageBills = filteredBills.slice(start, start+PAGE_SIZE);
        
        if(pageBills.length === 0 && filteredBills.length === 0){ 
            tbody.innerHTML = '<tr><td colspan="12" class="text-center py-8 text-gray-400">No bills found. Click "Sync from Firebase" to load data.</td></tr>';
            return; 
        }
        
        tbody.innerHTML = pageBills.map(bill => {
            let status = getBillStatus(bill);
            let statusText = status === 'paid' ? 'Paid' : (status === 'partial' ? 'Partial' : 'Unpaid');
            let statusColor = status === 'paid' ? 'bg-green-100 text-green-800' : (status === 'partial' ? 'bg-yellow-100 text-yellow-800' : 'bg-red-100 text-red-800');
            let hasInvoices = bill.invoiceDetails && bill.invoiceDetails.length > 0;
            
            return `<tr>
                <td class="px-3 py-2"><input type="checkbox" class="bill-select" data-id="${bill.id}"></td>
                <td class="px-3 py-2 font-mono">${escapeHtml(bill.clientCode)}${hasInvoices ? '<br><span class="text-xs text-amber-600"><i class="fas fa-receipt"></i> +inv</span>' : ''}</td>
                <td class="px-3 py-2 font-medium">${escapeHtml(bill.customerName)}</td>
                <td class="px-3 py-2">${escapeHtml(bill.mobile)}</td>
                <td class="px-3 py-2">${escapeHtml(bill.package)}</td>
                <td class="px-3 py-2">${escapeHtml(bill.area)}</td>

    function renderPagination(){ 
        let totalPages = Math.ceil(filteredBills.length/PAGE_SIZE); 
        let c = document.getElementById('paginationControls'); 
        if(!c) return;
        if(totalPages <= 1 && filteredBills.length === 0){ c.innerHTML = ''; return; } 
        let html = `<div class="text-sm text-gray-600">Showing ${((currentPage-1)*PAGE_SIZE)+1}-${Math.min(currentPage*PAGE_SIZE,filteredBills.length)} of ${filteredBills.length} bills</div><div class="flex gap-2">`; 
        if(currentPage > 1) html += `<button class="page-btn px-3 py-1 border rounded bg-white hover:bg-gray-100 cursor-pointer" data-page="${currentPage-1}">Prev</button>`; 
        for(let i = Math.max(1, currentPage-2); i <= Math.min(totalPages, currentPage+2); i++) {
            html += `<button class="page-btn px-3 py-1 border rounded ${i === currentPage ? 'bg-red-600 text-white' : 'bg-white hover:bg-gray-100'} cursor-pointer" data-page="${i}">${i}</button>`;
        }
        if(currentPage < totalPages) html += `<button class="page-btn px-3 py-1 border rounded bg-white hover:bg-gray-100 cursor-pointer" data-page="${currentPage+1}">Next</button>`; 
        html += `</div>`; 
        c.innerHTML = html; 
        document.querySelectorAll('.page-btn').forEach(btn => btn.addEventListener('click', () => { currentPage = parseInt(btn.dataset.page); renderTableBody(); renderPagination(); }));
    }

    function updateDashboard(){

        let totalBill = monthBills.reduce((s,b)=>s+b.monthlyBillAmount,0); 
        let totalDiscount = monthBills.reduce((s,b)=>s+(b.discount||0),0);

    async function sendSingleWhatsApp(billId) {
        let bill = bills.find(b => b.id === billId);
        if(!bill) return;
        let phone = String(bill.mobile).replace(/\D/g, '');
        if(phone.startsWith('0') && phone.length === 11) phone = '92' + phone.slice(1);
        if(!phone || phone.length < 10) { alert("No valid mobile number."); return; }
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(generateWhatsAppMessage(bill))}`, '_blank');
    }
    
    async function sendSelectedWhatsApp() {
        let ids = [...document.querySelectorAll('.bill-select:checked')].map(cb=>parseInt(cb.dataset.id));
        if(ids.length === 0) { alert("Select bills first."); return; }
        let selected = bills.filter(b => ids.includes(b.id) && getBillStatus(b) !== 'paid');
        if(selected.length === 0) { alert("Selected bills are already paid."); return; }
        if(!confirm(`Send reminder to ${selected.length} client(s)?`)) return;
        for(let i=0; i<selected.length; i++) setTimeout(() => { 
            let p = String(selected[i].mobile).replace(/\D/g, '');
            if(p.startsWith('0') && p.length === 11) p = '92' + p.slice(1);
            if(p) window.open(`https://wa.me/${p}?text=${encodeURIComponent(generateWhatsAppMessage(selected[i]))}`, '_blank'); 
        }, i*800);
    }

                            <p class="text-xs text-gray-500 mt-1">Directly edit total received amount</p>

                <div class="bg-gray-100 p-3 rounded-lg text-center">
                    <div class="grid grid-cols-3 gap-2">
                        <div><span class="text-xs">Total Bill</span><br><b id="displayTotalBill">Rs. ${numberFormat(bill.monthlyBillAmount)}</b></div>

                        <div><span class="text-xs">Net Due</span><br><b id="displayNetDue" class="text-red-600">Rs. ${numberFormat(bill.netDue)}</b></div>
                    </div>
                </div>
                
                <div class="flex gap-2 pt-2">
                    <button id="saveEditBillBtn" class="bg-blue-600 text-white px-4 py-2 rounded-lg flex-1">💾 Save Changes</button>

                </div>
            </div>
        `;
        
        document.getElementById('modalTitle').innerText = 'Edit Bill';
        document.getElementById('modalBody').innerHTML = html;
        document.getElementById('billModal').classList.add('active');
        
        function updateCalculations() {
            let baseAmount = parseFloat(document.getElementById('eBaseAmount')?.value) || 0;
            let discount = parseFloat(document.getElementById('editDiscount')?.value) || 0;
            let received = parseFloat(document.getElementById('editReceivedAmount')?.value) || 0;
            let invoiceTotal = bill.invoiceTotal || 0;
            let totalBill = baseAmount + invoiceTotal;
            let netDue = totalBill - discount - received;
            if (netDue < 0) netDue = 0;
            
            let totalSpan = document.getElementById('displayTotalBill');
            let receivedSpan = document.getElementById('displayReceived');
            let dueSpan = document.getElementById('displayNetDue');
            if(totalSpan) totalSpan.innerHTML = `Rs. ${numberFormat(totalBill)}`;
            if(receivedSpan) receivedSpan.innerHTML = `Rs. ${numberFormat(received)}`;
            if(dueSpan) dueSpan.innerHTML = `Rs. ${numberFormat(netDue)}`;
            let currentDisplay = document.getElementById('currentReceivedDisplay');
            if(currentDisplay) currentDisplay.innerHTML = `Rs. ${numberFormat(received)}`;
        }
        
        document.getElementById('eBaseAmount')?.addEventListener('input', updateCalculations);
        document.getElementById('editDiscount')?.addEventListener('input', updateCalculations);
        document.getElementById('editReceivedAmount')?.addEventListener('input', updateCalculations);
        
        document.getElementById('saveEditBillBtn').onclick = () => {
            bill.customerName = document.getElementById('eName').value;
            bill.mobile = document.getElementById('eMobile').value;
            bill.clientCode = document.getElementById('eCode').value;
            bill.package = document.getElementById('ePkg').value;
            bill.area = document.getElementById('eArea').value;
            bill.userId = document.getElementById('eUser').value;
            bill.billMonth = document.getElementById('eMonth').value;
            bill.dueDate = document.getElementById('eDue').value;
            bill.baseMonthlyAmount = parseFloat(document.getElementById('eBaseAmount').value) || 0;
            let invoiceTotal = bill.invoiceTotal || 0;
            bill.monthlyBillAmount = bill.baseMonthlyAmount + invoiceTotal;
            bill.discount = parseFloat(document.getElementById('editDiscount').value) || 0;
            
            let newReceived = parseFloat(document.getElementById('editReceivedAmount').value) || 0;
            let oldReceived = bill.alreadyPaid;
            
            if (newReceived !== oldReceived) {
                let diff = newReceived - oldReceived;
                let method = document.getElementById('editMethod').value;
                if (diff > 0) {
                    bill.payments.push({
                        amount: diff,
                        method: method,
                        date: today(),
                        timestamp: getCurrentTimestamp(),
                        note: 'Manual adjustment'
                    });
                } else if (diff < 0) {
                    let amountToRemove = Math.abs(diff);
                    while (amountToRemove > 0 && bill.payments.length > 0) {
                        let lastPayment = bill.payments[bill.payments.length - 1];
                        if (lastPayment.amount > amountToRemove) {
                            lastPayment.amount -= amountToRemove;
                            amountToRemove = 0;
                        } else {
                            amountToRemove -= lastPayment.amount;
                            bill.payments.pop();
                        }
                    }
                }
            }
            
            recalcBill(bill);
            saveLocal();
            applyFiltersAndRender();
            updateDashboard();
            document.getElementById('billModal').classList.remove('active');
            alert(`Bill updated!\nTotal Bill: Rs. ${numberFormat(bill.monthlyBillAmount)}\nReceived: Rs. ${numberFormat(bill.alreadyPaid)}\nNet Due: Rs. ${numberFormat(bill.netDue)}`);
        };
        
        document.getElementById('closeEditModalBtn').onclick = () => document.getElementById('billModal').classList.remove('active');
        updateCalculations();
    }

        let html = `<div class="space-y-3"><div class="grid grid-cols-2 gap-2">
            <div><label>Customer Name *</label><input id="eName" class="border rounded p-2 w-full"></div>
            <div><label>Mobile *</label><input id="eMobile" class="border rounded p-2 w-full"></div>
            <div><label>Client Code</label><input id="eCode" class="border rounded p-2 w-full"></div>
            <div><label>Package</label><input id="ePkg" class="border rounded p-2 w-full" value="4mb"></div>
            <div><label>Area</label><input id="eArea" class="border rounded p-2 w-full"></div>
            <div><label>User ID</label><input id="eUser" class="border rounded p-2 w-full"></div>
            <div><label>Bill Month</label><input id="eMonth" class="border rounded p-2 w-full" value="${currentMonthFilter}"></div>
            <div><label>Due Date</label><input id="eDue" class="border rounded p-2 w-full" value="${currentMonthFilter}-10"></div>
            <div><label>Monthly Bill (Rs)</label><input id="eAmount" type="number" class="border rounded p-2 w-full" value="1500"></div>
            <div><label>Discount (Rs)</label><input id="eDiscount" type="number" class="border rounded p-2 w-full" value="0"></div>
        </div>
        <button id="saveNewBillBtn" class="bg-blue-600 text-white px-4 py-2 rounded w-full">Save Bill</button></div>`;
        document.getElementById('modalTitle').innerText = 'Add New Bill';
        document.getElementById('modalBody').innerHTML = html;
        document.getElementById('billModal').classList.add('active');
        document.getElementById('saveNewBillBtn').onclick = () => {
            newBill.customerName = document.getElementById('eName').value; 
            newBill.mobile = document.getElementById('eMobile').value; 
            newBill.clientCode = document.getElementById('eCode').value;
            newBill.package = document.getElementById('ePkg').value; 
            newBill.area = document.getElementById('eArea').value; 
            newBill.userId = document.getElementById('eUser').value;
            newBill.billMonth = document.getElementById('eMonth').value; 
            newBill.dueDate = document.getElementById('eDue').value; 
            newBill.monthlyBillAmount = parseFloat(document.getElementById('eAmount').value) || 0;
            newBill.baseMonthlyAmount = newBill.monthlyBillAmount;
            newBill.discount = parseFloat(document.getElementById('eDiscount').value) || 0;
            if(!newBill.customerName) return alert("Customer name required");
            recalcBill(newBill); 
            bills.push(newBill); 
            saveLocal(); 
            applyFiltersAndRender(); 
            updateDashboard(); 
            updateFilters(); 
            document.getElementById('billModal').classList.remove('active');
            alert(`Bill added for ${newBill.customerName}\nDue: Rs. ${newBill.netDue}`);
        };
        document.getElementById('closeModalBtn').onclick = () => document.getElementById('billModal').classList.remove('active');
    });
    
    // CSV Import
    document.getElementById('csvUpload').addEventListener('change', function(e){ 
        let file = e.target.files[0]; if(!file) return; 
        Papa.parse(file, {header: true, complete: function(r){ 
            let added = 0; 
            for(let row of r.data){ 
                if(!row['Customer Name']) continue; 
                let payments = []; let paid = parseFloat(row['Already Paid']||0); 
                if(paid > 0) payments.push({amount: paid, method: "CSV Import", date: today(), timestamp: getCurrentTimestamp()}); 
                let nb = { id: nextId++, customerName: row['Customer Name'], mobile: row['Mobile'], clientCode: row['Client Code'],
                    package: row['Package'], area: row['Area'], userId: row['User ID / PPPoE'],
                    billMonth: row['Bill Month'] || currentMonthFilter, issueDate: row['Issue Date'] || today(),
                    dueDate: row['Due Date'] || `${currentMonthFilter}-10`, monthlyBillAmount: parseFloat(row['Monthly Bill Amount']) || 0,
                    baseMonthlyAmount: parseFloat(row['Monthly Bill Amount']) || 0, discount: parseFloat(row['Discount']) || 0, 
                    payments: payments, invoiceDetails: [], receiptId: generateReceiptId() }; 
                recalcBill(nb); bills.push(nb); added++; 
            } 
            if(added){ saveLocal(); applyFiltersAndRender(); updateDashboard(); updateFilters(); alert(`Imported ${added} bills`); } 
        }}); e.target.value = ''; 
    });
    
    document.getElementById('downloadTemplateBtn').addEventListener('click', () => { 
        let headers = ["Customer Name","Mobile","Client Code","Package","Area","User ID / PPPoE","Bill Month","Issue Date","Due Date","Monthly Bill Amount","Discount","Already Paid"]; 
        let sample = ["Sheraz","03021433803","0518","4mb","HEAD QUARTER","HQSabir","2026-06","2026-06-04","2026-06-10","2200","200","1000"]; 
        let csv = headers.join(",")+"\n"+sample.join(","); 
        let blob = new Blob([csv], {type: "text/csv"}); let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "bill_template.csv"; a.click(); 
    });
    
    document.getElementById('exportBillsBtn').addEventListener('click', () => { 
        let exportData = bills.map(b => ({ "Customer Name": b.customerName, "Mobile": b.mobile, "Client Code": b.clientCode,
            "Package": b.package, "Area": b.area, "User ID": b.userId, "Bill Month": b.billMonth, "Due Date": b.dueDate,
            "Monthly Bill": b.monthlyBillAmount, "Discount": b.discount, "Total Paid": b.alreadyPaid, "Net Due": b.netDue,
            "Invoices": (b.invoiceDetails?.length || 0), "Status": getBillStatus(b) === 'paid' ? 'Paid' : (getBillStatus(b) === 'partial' ? 'Partial' : 'Unpaid') })); 
        let csv = Papa.unparse(exportData); let blob = new Blob([csv], {type: "text/csv"}); 
        let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `bills_export_${currentMonthFilter}.csv`; a.click(); 
    });
    
    // Event Listeners
    document.getElementById('syncFirebaseBtn').addEventListener('click', syncFromFirebase);
    document.getElementById('autoGenerateBtn').addEventListener('click', autoGenerateBills);
    document.getElementById('bulkPrintBtn').addEventListener('click', async() => { let ids = getSelectedBillIds(); if(ids.length) await printBills(bills.filter(b=>ids.includes(b.id))); else alert("Select bills to print"); });
    document.getElementById('exportPdfBtn').addEventListener('click', async() => { let ids = getSelectedBillIds(); if(ids.length) await printBills(bills.filter(b=>ids.includes(b.id)), true); else alert("Select bills to export"); });
    document.getElementById('whatsappSelectedBtn').addEventListener('click', sendSelectedWhatsApp);
    document.getElementById('selectAllBtn').addEventListener('click', () => { document.querySelectorAll('.bill-select').forEach(cb => cb.checked = true); updateSelectAllHeader(); });
    document.getElementById('selectAllHeader').addEventListener('change', (e) => { document.querySelectorAll('.bill-select').forEach(cb => cb.checked = e.target.checked); });
    document.getElementById('areaFilter').addEventListener('change', applyFiltersAndRender);
    document.getElementById('packageFilter').addEventListener('change', applyFiltersAndRender);
    document.getElementById('monthFilter').value = currentMonthFilter; 
    document.getElementById('monthFilter').addEventListener('change', (e) => { currentMonthFilter = e.target.value; applyFiltersAndRender(); updateDashboard(); });
    document.getElementById('searchInput').addEventListener('input', (e) => { currentSearch = e.target.value; applyFiltersAndRender(); });
    document.getElementById('closeModalBtn').addEventListener('click', () => document.getElementById('billModal').classList.remove('active'));
    
    document.querySelectorAll('.filter-btn').forEach(btn => btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('filter-active','bg-red-600','text-white')); 
        btn.classList.add('filter-active','bg-red-600','text-white'); 
        currentFilter = btn.dataset.filter; 
        applyFiltersAndRender(); 
    }));
    document.querySelector('.filter-btn[data-filter="all"]').classList.add('filter-active','bg-red-600','text-white');
    
    // Initialize
    loadLocal();
    applyFiltersAndRender();
    updateDashboard();
    updateFilters();
    initFirebase();
</script>
</body>
</html>
